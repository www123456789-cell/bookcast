<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>我的播客书架</title>
<style>
  body{font:15px/1.8 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
       max-width:760px;margin:40px auto;padding:0 18px;color:#1c2434}
  h1{font-size:20px}
  li{margin:10px 0}
  code{background:#f2f5fb;padding:2px 6px;border-radius:5px;font-size:12.5px}
  .tip{color:#5a667d;font-size:13px;margin-top:24px}
</style>
</head>
<body>
<h1>我的播客书架</h1>
<p>每本书是一个独立节目。在 iPhone「播客」App 里，资料库 → 右上角「…」→
   「通过 URL 添加节目」，粘贴下面任意一行即可。</p>
<ul id="list"><li>加载中…</li></ul>
<p class="tip">这个页面能打开，说明 GitHub Pages 部署正常。</p>
<script>
fetch("shows.json?t=" + Date.now()).then(r => r.json()).then(shows => {
  const ul = document.getElementById("list");
  if (!shows.length) { ul.innerHTML = "<li>还没有节目</li>"; return; }
  ul.innerHTML = shows.map(s =>
    `<li><b>${s.title}</b><br><code>${s.feed}</code></li>`).join("");
}).catch(() => {
  document.getElementById("list").innerHTML = "<li>读取 shows.json 失败</li>";
});
</script>
</body>
</html>
